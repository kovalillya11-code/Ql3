<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Бібліотека</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <img src="../static/image/logo_removebg-preview.png" alt="Бібліотека" class="logo-img">
        </div>
        <nav class="main-nav">
            <a href="{{ url_for('index') }}">Головна</a>
            <a href="{{ url_for('about') }}">Про автора</a>
            <a href="{{ url_for('library') }}">Бібліотека</a>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
